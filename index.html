<title>Catálogo Loma Plast 2026</title>

<style>
/* Layout: barra fija con buscador y marcas; lista de modelos con sus piezas, pensada para una mano */
:root {
  --bg: #f4f6f1; --surface: #ffffff; --fg: #17262b; --muted: #5d6b66; --line: #dde3d8;
  --navy: #0b2e38; --green: #6f9a24; --green-soft: #e6f0d4; --chip: #e9ede4; --on-navy: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1a1d; --surface: #16252a; --fg: #e7eee6; --muted: #9aaba4; --line: #26383e;
  --navy: #071e25; --green: #9ccc45; --green-soft: #22351f; --chip: #1f3036; --on-navy: #ffffff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1a1d; --surface: #16252a; --fg: #e7eee6; --muted: #9aaba4; --line: #26383e;
  --navy: #071e25; --green: #9ccc45; --green-soft: #22351f; --chip: #1f3036; --on-navy: #ffffff; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 16px/1.4 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--navy); color: var(--on-navy); }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 12px 8px; }
.brandmark { font: 700 1.5rem/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.brandmark span { color: #9ccc45; }
.count { font-size: .8rem; opacity: .8; font-variant-numeric: tabular-nums; }
.search { position: relative; padding-bottom: 10px; }
#q { width: 100%; box-sizing: border-box; border: 0; border-radius: 10px; padding: 12px 40px 12px 14px; font: 500 1rem var(--body); background: #ffffff; color: #17262b; }
#q:focus-visible { outline: 3px solid #9ccc45; }
#clear { position: absolute; right: 6px; top: 4px; border: 0; background: none; font-size: 1.4rem; color: #5d6b66; width: 36px; height: 40px; cursor: pointer; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-block: 0 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid rgba(255,255,255,.25); background: transparent; color: var(--on-navy); border-radius: 999px; padding: 6px 12px; font: 600 .85rem var(--body); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: #9ccc45; border-color: #9ccc45; color: #0b2e38; }
.chip:focus-visible, .lang button:focus-visible, .copy:focus-visible, #more:focus-visible { outline: 3px solid #9ccc45; outline-offset: 2px; }

.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-block: 12px 4px; color: var(--muted); font-size: .85rem; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { border: 0; background: var(--surface); color: var(--fg); padding: 5px 10px; font: 600 .8rem var(--body); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }

main { display: grid; gap: 14px; padding-block: 8px 32px; }
.model { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
.model h2 { margin: 0; padding: 10px 14px; font: 700 1.2rem/1.15 var(--display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
.model h2 small { font: 600 .75rem var(--body); color: var(--green); white-space: nowrap; align-self: center; text-transform: none; letter-spacing: 0; }
.item { padding: 10px 14px; display: grid; gap: 4px; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; }
.row1 { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; column-gap: 8px; }
.code { font: 700 1.05rem var(--display); color: var(--fg); letter-spacing: .02em; white-space: nowrap; }
.qty { font-size: .8rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.desc { font-size: .95rem; }
.tag { display: inline-block; margin-left: 6px; background: var(--green-soft); color: var(--fg); border-radius: 4px; padding: 0 6px; font: 600 .72rem var(--body); vertical-align: 1px; }
.oem { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); min-width: 0; }
.oem b { color: var(--fg); font-weight: 600; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.copy { flex: none; border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 6px; padding: 2px 8px; font: 600 .72rem var(--body); cursor: pointer; }
mark { background: #f3df7a; color: #17262b; border-radius: 2px; }
.cars { aspect-ratio: 400 / 110; background: #0b2e38 no-repeat; background-size: 100% auto; }
.item { grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; }
.item > :not(.thumb) { grid-column: 1; }
.thumb { grid-column: 2; grid-row: 1 / span 3; align-self: center; width: 120px; aspect-ratio: 240 / 90; background: #ffffff no-repeat; background-size: 100% auto; border-radius: 6px; border: 1px solid var(--line); }
@media (max-width: 360px) { .thumb { width: 96px; } }
.thumb { cursor: zoom-in; }
.thumb:focus-visible { outline: 3px solid #9ccc45; outline-offset: 2px; }
#zoom { position: fixed; inset: 0; z-index: 20; background: rgba(5, 15, 18, .9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; cursor: zoom-out; }
#zoom[hidden] { display: none; }
#zoom .zimg { width: min(94vw, 720px); aspect-ratio: 240 / 90; background: #ffffff no-repeat; background-size: 100% auto; border-radius: 10px; }
#zoom .zcap { margin: 0; max-width: min(94vw, 720px); color: #ffffff; text-align: center; font-size: .95rem; }
#zoom .zcap b { font: 700 1.15rem var(--display); letter-spacing: .02em; }
#zoom .zhint { color: rgba(255,255,255,.6); font-size: .78rem; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
#more { justify-self: center; border: 0; background: var(--navy); color: var(--on-navy); padding: 12px 22px; border-radius: 10px; font: 600 .95rem var(--body); cursor: pointer; }
footer { color: var(--muted); font-size: .72rem; padding-block: 0 24px; }
@media (min-width: 760px) { main { grid-template-columns: 1fr 1fr; align-items: start; } #more, .empty { grid-column: 1 / -1; } }
@media (prefers-reduced-motion: no-preference) { .model { animation: in .18s ease-out both; } @keyframes in { from { transform: translateY(4px); } } }
</style>

</div>

const SP = {"alfa-romeo":{"p":1,"c":1},"audi":{"p":2,"c":1},"chevrolet":{"p":219,"c":31},"citroen":{"p":75,"c":14},"dacia":{"p":19,"c":3},"fiat":{"p":258,"c":39},"ford":{"p":263,"c":33},"hyundai":{"p":24,"c":6},"honda":{"p":10,"c":3},"jeep":{"p":7,"c":2},"lancia":{"p":2,"c":1},"mercedes-benz":{"p":20,"c":3},"mitsubishi":{"p":3,"c":1},"nissan":{"p":35,"c":8},"peugeot":{"p":143,"c":21},"renault":{"p":315,"c":47},"toyota":{"p":130,"c":19},"volkswagen":{"p":359,"c":47}};
// cada fila: [marca, modelo, codigo, oem, es, en, fr, version, cant, pagina, foto pieza, foto autos]
// las fotos estan en una imagen por marca (img/p-<marca>.jpg, img/c-<marca>.jpg), una debajo de la otra
const $ = s => document.querySelector(s);
const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/\p{M}/gu, "");
const spritePos = (i, n) => (n > 1 ? (i / (n - 1)) * 100 : 0).toFixed(4) + "%";
const tight = s => norm(s).replace(/[\s\/\-.]/g, "");
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const IDX = D.map(r => norm([r[0], r[1], r[2], r[3], r[4], r[5], r[6], r[7]].join(" ")) + " " + tight(r[2] + " " + r[3]));
const brands = [...new Set(D.map(r => r[0]))];
let brand = "", lang = "es", shown = 40;
try { lang = localStorage.getItem("lp-lang") || "es"; } catch (e) {}

$("#total").textContent = D.length.toLocaleString("es-AR") + " productos";
$("#chips").innerHTML = ['<button class="chip" data-b="" aria-pressed="true">Todas</button>']
  .concat(brands.map(b => `<button class="chip" data-b="${esc(b)}" aria-pressed="false">${esc(b)}</button>`)).join("");

function hl(text, terms) {
  let out = esc(text);
  for (const t of terms) if (t.length > 1) {
    const rx = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    out = out.replace(rx, "<mark>$1</mark>");
  }
  return out;
}

function render() {
  const q = norm($("#q").value.trim());
  const terms = q.split(/\s+/).filter(Boolean);
  const hits = [];
  for (let i = 0; i < D.length; i++) {
    if (brand && D[i][0] !== brand) continue;
    if (terms.length && !terms.every(t => IDX[i].includes(t) || IDX[i].includes(t.replace(/[\s\/\-.]/g, "")))) continue;
    hits.push(i);
  }
  const groups = [];
  for (const i of hits) {
    const r = D[i], key = r[0] + "|" + r[1];
    if (!groups.length || groups[groups.length - 1].key !== key) groups.push({ key, b: r[0], m: r[1], items: [] });
    groups[groups.length - 1].items.push(r);
  }
  const L = { es: 4, en: 5, fr: 6 }[lang];
  const raw = $("#q").value.trim().split(/\s+/).filter(Boolean);
  $("#status").textContent = hits.length
    ? `${hits.length.toLocaleString("es-AR")} piezas · ${groups.length} modelos`
    : "";
  $("#list").innerHTML = groups.length ? groups.slice(0, shown).map(g => {
    const s = slug(g.b), sp = SP[s] || {}, car = g.items[0][11];
    return `
    <section class="model">
      ${sp.c ? `<div class="cars" role="img" aria-label="${esc(g.m)}" style="background-image:url(img/c-${s}.jpg);background-position:0 ${spritePos(car, sp.c)}"></div>` : ""}
      <h2>${hl(g.m, raw)}<small>${esc(g.b)}</small></h2>
      ${g.items.map(r => `
        <div class="item">
          ${r[10] >= 0 && sp.p ? `<div class="thumb" role="button" tabindex="0" aria-label="Ver foto grande de ${esc(r[2])}" style="background-image:url(img/p-${s}.jpg);background-position:0 ${spritePos(r[10], sp.p)}"></div>` : ""}
          <div class="row1"><span class="code">${hl(r[2], raw)}</span><span class="qty">${esc(r[8] || "")}${r[9] ? " · pág. " + r[9] : ""}</span></div>
          <div class="desc">${hl(r[L] || r[4], raw)}${r[7] ? `<span class="tag">${esc(r[7])}</span>` : ""}</div>
          ${r[3] ? `<div class="oem">OEM <b>${hl(r[3], raw)}</b><button class="copy" data-oem="${esc(r[3])}">Copiar</button></div>` : ""}
        </div>`).join("")}
    </section>`;
  }).join("") + (groups.length > shown ? `<button id="more">Ver más modelos (${groups.length - shown})</button>` : "")
    : `<p class="empty">No hay piezas que coincidan con “${esc($("#q").value)}”${brand ? " en " + esc(brand) : ""}.<br>Probá con el código LHT, el número OEM o el nombre del modelo.</p>`;
}

let timer;
$("#q").addEventListener("input", () => { $("#clear").hidden = !$("#q").value; shown = 40; clearTimeout(timer); timer = setTimeout(render, 120); });
$("#clear").addEventListener("click", () => { $("#q").value = ""; $("#clear").hidden = true; shown = 40; render(); $("#q").focus(); });
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  brand = b.dataset.b; shown = 40;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  window.scrollTo({ top: 0 });
  render();
});
document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.l;
  try { localStorage.setItem("lp-lang", lang); } catch (e) {}
  document.querySelectorAll(".lang button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
});
$("#list").addEventListener("click", e => {
  if (e.target.id === "more") { shown += 40; render(); return; }
  const t = e.target.closest(".thumb"); if (t) { openZoom(t); return; }
  const c = e.target.closest(".copy"); if (!c) return;
  const done = () => { c.textContent = "Copiado"; setTimeout(() => (c.textContent = "Copiar"), 1400); };
  navigator.clipboard?.writeText(c.dataset.oem).then(done, () => {
    const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(c.previousElementSibling); s.removeAllRanges(); s.addRange(rg);
  });
});
// foto grande de la pieza: misma imagen y posicion que la miniatura
let zoomFrom = null;
function openZoom(t) {
  const it = t.closest(".item"), z = $("#zoom");
  z.querySelector(".zimg").style.cssText = t.style.cssText;
  z.querySelector(".zcap").innerHTML = `<b>${esc(it.querySelector(".code").textContent)}</b><br>${esc(it.querySelector(".desc").firstChild.textContent)}`;
  zoomFrom = t; z.hidden = false;
}
function closeZoom() { $("#zoom").hidden = true; zoomFrom?.focus(); zoomFrom = null; }
$("#zoom").addEventListener("click", closeZoom);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#zoom").hidden) { closeZoom(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("thumb")) { e.preventDefault(); openZoom(e.target); }
});
// marca desde el link (#fiat, #renault...)
const h = location.hash.slice(1);
const hb = brands.find(b => slug(b) === h);
if (hb) { brand = hb; document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.b === hb))); }
document.querySelectorAll(".lang button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.l === lang)));
render();
</script>
